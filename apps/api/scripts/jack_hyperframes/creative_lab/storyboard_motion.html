<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#080d16}#main{position:relative;width:1080px;height:1920px;overflow:hidden;background:#101b2c;color:#f7f4ed;font-family:system-ui,sans-serif}canvas{position:absolute;inset:0}.grade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 78% 18%,#648ed41a,transparent 48%),linear-gradient(180deg,transparent 65%,#05070b99);mix-blend-mode:screen}.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 180px #02040a99}#eyebrow{position:absolute;top:105px;left:90px;font-size:24px;font-weight:700;letter-spacing:6px;color:#ff9c68}#title{position:absolute;top:155px;left:90px;width:900px;height:230px;font:650 68px/1.08 system-ui,sans-serif;letter-spacing:-1.5px;overflow:hidden;overflow-wrap:anywhere}#caption{position:absolute;bottom:155px;left:90px;width:900px;font:600 44px/1.25 system-ui,sans-serif;text-align:center;text-shadow:0 3px 15px #000}#labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;transform:translate(-50%,-50%);max-width:330px;text-align:center;overflow-wrap:anywhere;font:600 26px/1.2 system-ui,sans-serif;padding:11px 17px;background:#09111de6;border:1px solid #ffffff24;border-radius:15px;color:white;box-shadow:0 14px 30px #0007}.transition{position:absolute;inset:0;pointer-events:none;opacity:0}.progress{position:absolute;bottom:105px;left:90px;width:900px;height:5px;background:#ffffff20}.progress i{display:block;height:100%;background:#ff9c68;transform-origin:left}.scene-no{position:absolute;bottom:92px;right:90px;font:22px ui-monospace,monospace;color:#ffffff99}
</style></head><body><div id="main" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920"><canvas id="stage"></canvas><div class="grade"></div><div class="vignette"></div><div id="eyebrow">JACK / CREATIVE MOTION</div><div id="title"></div><div id="caption"></div><div id="labels"></div><div class="transition"></div><div class="progress"><i></i></div><div class="scene-no"></div></div><script src="./vendor/gsap.min.js"></script><script type="module">
import * as T from './vendor/three.module.js';import {studio,object,applyTrack} from './motion_skills.mjs';
const cfg=__CONFIG__,words=__WORDS__,duration=cfg.total_frames/30,clamp=value=>Math.max(0,Math.min(1,value)),mix=(a,b,u)=>a+(b-a)*u,smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const art=cfg.art_direction||{};document.querySelector('#main').style.color=art.foreground||'#f7f4ed';document.querySelector('#eyebrow').style.color=art.accent||'#ff9c68';document.querySelector('.progress i').style.background=art.accent||'#ff9c68';
const opts=cfg.render_options||{},captionNode=document.querySelector('#caption');captionNode.style.left=(opts.caption_left??90)+'px';captionNode.style.width=(opts.caption_width??900)+'px';captionNode.style.bottom=(opts.caption_bottom??155)+'px';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,preserveDrawingBuffer:true,powerPreference:'low-power'});renderer.setSize(1080,1920,false);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene();scene.background=new T.Color(cfg.background);const camera=new T.PerspectiveCamera(42,1080/1920,.1,100),setLight=studio(scene,renderer),root=new T.Group();scene.add(root);
if(cfg.objects.some(item=>!cfg.capabilities.kinds.includes(item.kind)||item.tracks.some(track=>!cfg.capabilities.actions.includes(track.action))))throw Error('Capability mismatch');
const entries=cfg.objects.map(spec=>{const built=object(spec.kind,spec.color,spec.label),label=document.createElement('div');label.className='label';label.textContent=spec.label;document.querySelector('#labels').append(label);root.add(built.group);return {spec,...built,label,last:null};});
function cameraAt(frame){const keys=cfg.camera;if(frame<=keys[0].frame)return keys[0];if(frame>=keys.at(-1).frame)return keys.at(-1);for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(a.frame<=frame&&frame<=b.frame){const u=smooth((frame-a.frame)/Math.max(1,b.frame-a.frame));return {position:a.position.map((value,j)=>mix(value,b.position[j],u)),look_at:a.look_at.map((value,j)=>mix(value,b.look_at[j],u)),fov:mix(a.fov,b.fov,u)};}}return keys.at(-1);}
function transitionState(name,edge,tail){const strength=Math.max(edge,tail),node=document.querySelector('.transition');node.style.opacity='0';node.style.background='none';renderer.domElement.style.opacity='1';root.position.x=0;root.rotation.y=0;root.scale.setScalar(1);if(name==='occlusion'){node.style.background='linear-gradient(90deg,#080d16 0 45%,transparent 70%)';node.style.opacity=String(strength);root.position.x=(edge-tail)*1.1;}else if(name==='directional'){root.position.x=(edge-tail)*2.1;}else if(name==='dissolve'){renderer.domElement.style.opacity=String(1-strength*.75);node.style.background='radial-gradient(circle,#fff3 1px,transparent 2px) 0 0/22px 22px';node.style.opacity=String(strength*.45);}else if(name==='spatial'){root.rotation.y=(edge-tail)*.32;root.scale.setScalar(1+strength*.12);}else if(name==='match_cut'){root.scale.setScalar(1+strength*.08);}if(opts.transition_flash&&strength>.7){node.style.background='#fff';node.style.opacity=String((strength-.7)/.3);}root.position.x+=opts.subject_offset_x||0;return strength;}
function draw(time){const frame=Math.min(cfg.total_frames-1,Math.floor(time*30+1e-6)),sceneIndex=cfg.scenes.findIndex(item=>item.start_frame<=frame&&frame<item.end_frame),shot=cfg.scenes[Math.max(0,sceneIndex)];if(!shot)return;
 const local=(frame-shot.start_frame)/Math.max(1,shot.end_frame-shot.start_frame-1),edge=clamp(1-(frame-shot.start_frame)/7),tail=clamp(1-(shot.end_frame-1-frame)/7),preset=/technical|cool/i.test(shot.lighting)?'technical':/product/i.test(shot.lighting)?'product':/warm/i.test(shot.lighting)?'warm':/dramatic|rim/i.test(shot.lighting)?'dramatic':'studio';setLight(preset);renderer.toneMappingExposure*=opts.exposure??1;
 const activeActions=[];for(const entry of entries){const active=shot.active_ids.includes(entry.spec.id);entry.group.visible=active;entry.label.hidden=!active;if(!active)continue;let track=entry.spec.tracks.filter(item=>item.start_frame<=frame).at(-1)||entry.spec.tracks.find(item=>item.end_frame>=frame);if(!track){entry.group.visible=false;entry.label.hidden=true;continue;}const state=applyTrack(entry,track,frame),slot=shot.active_ids.indexOf(entry.spec.id),count=shot.active_ids.length;if(count>1){entry.group.position.x+=(slot%2-.5)*1.6;if(count>2)entry.group.position.y+=(.5-Math.floor(slot/2))*2;}if(entry.spec.kind==='chart')entry.group.position.x-=.35;entry.label.hidden=!entry.group.visible;entry.last={track,state};if(track.start_frame<=frame&&frame<track.end_frame)activeActions.push({object_id:entry.spec.id,action:track.action,progress:state.amount});}
 const pose=cameraAt(frame);camera.position.fromArray(pose.position);camera.lookAt(new T.Vector3(...pose.look_at));camera.fov=pose.fov;camera.updateProjectionMatrix();camera.updateMatrixWorld();const transition=transitionState(shot.transition,edge,tail);root.updateMatrixWorld(true);
 const occupied=[],geometry=[];for(const entry of entries){if(!entry.group.visible)continue;const box=new T.Box3().setFromObject(entry.group),points=[];for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z]){const point=new T.Vector3(x,y,z).project(camera);points.push([(point.x*.5+.5)*1080,(.5-point.y*.5)*1920]);}const bounds={left:Math.min(...points.map(point=>point[0])),right:Math.max(...points.map(point=>point[0])),top:Math.min(...points.map(point=>point[1])),bottom:Math.max(...points.map(point=>point[1])),id:entry.spec.id};geometry.push(bounds);occupied.push(bounds);const center=box.getCenter(new T.Vector3()).project(camera);entry.label.style.left=Math.max(235,Math.min(845,(center.x*.5+.5)*1080))+'px';entry.label.style.top=Math.max(470,Math.min(1420,(.5-center.y*.5)*1920))+'px';}
 const title=document.querySelector('#title');title.textContent=shot.title;title.style.fontSize=((shot.title.length>35?54:68)*(opts.title_scale??1))+'px';const wordIndex=words.findIndex(word=>time>=word.start&&time<word.end),caption=document.querySelector('#caption');caption.textContent=wordIndex<0?'':words.slice(Math.max(0,wordIndex-2),wordIndex+3).map(word=>word.word).join(' ');document.querySelector('.progress i').style.transform='scaleX('+time/duration+')';document.querySelector('.scene-no').textContent=String(sceneIndex+1).padStart(2,'0')+' / '+String(cfg.scenes.length).padStart(2,'0');
 renderer.render(scene,camera);const pixelsVisible=entries.some(entry=>entry.group.visible&&entry.last?.state.opacity>.02);window.__jackState={frame,scene:sceneIndex,geometry,visibleIds:entries.filter(entry=>entry.group.visible).map(entry=>entry.spec.id),activeActions,camera:{position:pose.position.slice(),look_at:pose.look_at.slice(),fov:pose.fov},lighting:preset,transition:{name:shot.transition,strength:transition},blank:!pixelsVisible,partCount:entries.reduce((total,entry)=>total+entry.parts.length,0)};}
const state={time:0},timeline=gsap.timeline({paused:true});timeline.to(state,{time:duration,duration,ease:'none',onUpdate:()=>draw(state.time)});window.__timelines={main:timeline};window.__jackInspect=time=>{draw(time);return structuredClone(window.__jackState);};draw(0);
</script></body></html>
