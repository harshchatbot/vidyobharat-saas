<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}#main{position:relative;width:1080px;height:1920px;overflow:hidden;background:#101b2c;color:white;font-family:Arial}canvas{position:absolute;inset:0}#title{position:absolute;top:150px;left:90px;width:900px;font:76px Georgia;line-height:1.08}#caption{position:absolute;bottom:160px;left:90px;width:900px;font:48px Arial;text-align:center}#labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;transform:translate(-50%,-50%);font:30px Arial;padding:10px 16px;background:#101b2cdd;border-radius:12px;color:white}</style></head><body><div id="main" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920"><canvas id="stage"></canvas><div id="labels"></div><div id="title"></div><div id="caption"></div></div><script src="./vendor/gsap.min.js"></script><script type="module">
import * as T from './vendor/three.module.js';import {studio,object,fit} from './motion_skills.mjs';
const cfg=__CONFIG__,words=__WORDS__,duration=cfg.total_frames/30;
const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,preserveDrawingBuffer:true});renderer.setSize(1080,1920,false);renderer.toneMapping=T.ACESFilmicToneMapping;
const scene=new T.Scene();scene.background=new T.Color(cfg.background);const camera=new T.PerspectiveCamera(40,1080/1920,.1,100),light=studio(scene,renderer);light('studio');
const root=new T.Group();scene.add(root);
const entries=cfg.objects.map(spec=>{const o=object(spec.kind,spec.color);root.add(o.group);const label=document.createElement('div');label.className='label';label.textContent=spec.label;document.querySelector('#labels').append(label);return {spec,o,label};});
const mix=(a,b,u)=>a+(b-a)*u,clamp=x=>Math.max(0,Math.min(1,x)),ease=gsap.parseEase('power2.inOut');
function draw(t){const frame=Math.min(cfg.total_frames-1,Math.floor(t*30)),s=cfg.scenes.find(s=>frame>=s.start_frame&&frame<s.end_frame);
for(const {spec,o,label} of entries){const a=spec.tracks.filter(a=>a.start_frame<=frame).at(-1);o.group.visible=!!a;label.hidden=!a;if(!a)continue;const u=ease(clamp((frame-a.start_frame)/(a.end_frame-a.start_frame))),opacity=mix(a.from_opacity,a.to_opacity,u),spread=mix(a.spreadFrom,a.spreadTo,u);o.group.visible=opacity>.01;label.hidden=!o.group.visible;o.group.position.fromArray(a.from_position.map((v,i)=>mix(v,a.to_position[i],u)*.4));o.group.scale.setScalar(mix(a.from_scale,a.to_scale,u));o.group.rotation.y=mix(a.rotationFrom,a.rotationTo,u);o.parts.forEach(({mesh,home},i)=>{mesh.position.copy(home);mesh.position.x+=(i-(o.parts.length-1)/2)*.35*spread;mesh.position.z+=Math.sin(i*2)*.65*spread;mesh.material.transparent=true;mesh.material.opacity=opacity;});}
const box=new T.Box3();for(const {o} of entries)if(o.group.visible)box.union(new T.Box3().setFromObject(o.group));if(!box.isEmpty()){const c=box.getCenter(new T.Vector3()),r=box.getBoundingSphere(new T.Sphere()).radius,dist=Math.max(5,r/Math.sin(.18));camera.position.set(c.x+Math.sin(t*.2)*dist*.12,c.y,c.z+dist);camera.lookAt(c);camera.updateMatrixWorld();}else{camera.position.set(0,0,8);camera.lookAt(0,0,0);}
for(const {o,label} of entries)if(o.group.visible){const v=new T.Box3().setFromObject(o.group).getCenter(new T.Vector3()).project(camera);label.style.left=(v.x*.5+.5)*1080+'px';label.style.top=(.5-v.y*.5)*1920+100+'px';}
const title=document.querySelector('#title');title.textContent=s.title;title.style.color=new T.Color(cfg.background).getHSL({h:0,s:0,l:0}).l>.55?'#15283b':'#fff';const wi=words.findIndex(w=>t>=w.start&&t<w.end);const cap=document.querySelector('#caption');cap.textContent=wi<0?'':words.slice(Math.max(0,wi-2),wi+3).map(w=>w.word).join(' ');cap.style.color=title.style.color;renderer.render(scene,camera);}
const state={t:0},tl=gsap.timeline({paused:true});tl.to(state,{t:duration,duration,ease:'none',onUpdate:()=>draw(state.t)});window.__timelines={main:tl};draw(0);
</script></body></html>
