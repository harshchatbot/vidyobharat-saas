<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}#main{position:relative;width:1080px;height:1920px;overflow:hidden;background:#101b2c;color:white;font-family:Arial}canvas{position:absolute;inset:0}#title{position:absolute;top:150px;left:90px;width:900px;font:64px Georgia;line-height:1.08}#caption{position:absolute;bottom:160px;left:90px;width:900px;font:48px Arial;text-align:center}#labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;transform:translate(-50%,-50%);max-width:420px;text-align:center;overflow-wrap:anywhere;font:30px Arial;padding:10px 16px;background:#101b2cdd;border-radius:12px;color:white}</style></head><body><div id="main" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920"><canvas id="stage"></canvas><div id="labels"></div><div id="title"></div><div id="caption"></div></div><script src="./vendor/gsap.min.js"></script><script type="module">
import * as T from './vendor/three.module.js';import {studio,object,fit} from './motion_skills.mjs';
const cfg=__CONFIG__,words=__WORDS__,duration=cfg.total_frames/30;
const renderer=new T.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,preserveDrawingBuffer:true});renderer.setSize(1080,1920,false);renderer.toneMapping=T.ACESFilmicToneMapping;
const scene=new T.Scene();scene.background=new T.Color(cfg.background);const camera=new T.PerspectiveCamera(40,1080/1920,.1,100),light=studio(scene,renderer);light('studio');
if(cfg.objects.some(o=>!cfg.capabilities.kinds.includes(o.kind)||o.tracks.some(a=>!cfg.capabilities.actions.includes(a.action))))throw Error("Capability mismatch");
const root=new T.Group();scene.add(root);
const entries=cfg.objects.map(spec=>{const o=object(spec.kind,spec.color,spec.label);root.add(o.group);const label=document.createElement('div');label.className='label';label.textContent=spec.label;document.querySelector('#labels').append(label);return {spec,o,label};});
const mix=(a,b,u)=>a+(b-a)*u,clamp=x=>Math.max(0,Math.min(1,x)),ease=gsap.parseEase('power2.inOut');
function draw(t){const frame=Math.min(cfg.total_frames-1,Math.floor(t*30)),s=cfg.scenes.find(s=>frame>=s.start_frame&&frame<s.end_frame);
for(const {spec,o,label} of entries){const a=s.active_ids.includes(spec.id)?spec.tracks.filter(a=>a.start_frame<=frame).at(-1):null;o.group.visible=!!a;label.hidden=!a;if(!a)continue;const u=ease(clamp((frame-a.start_frame)/(a.end_frame-a.start_frame))),opacity=mix(a.from_opacity,a.to_opacity,u)*Math.min(1,(frame-s.start_frame+1)/6,(s.end_frame-frame)/6),spread=mix(a.spreadFrom,a.spreadTo,u);o.group.visible=opacity>.01;label.hidden=!o.group.visible;const slot=s.active_ids.indexOf(spec.id),n=s.active_ids.length;const primary=spec.id===s.primary_id;o.group.position.set(n===1?0:(slot%2-.5)*3.2,n<=2?0:(.5-Math.floor(slot/2))*2.8,0);o.group.scale.setScalar((primary?1:.78)*Math.min(1.15,Math.max(.65,mix(a.from_scale,a.to_scale,u))));o.group.rotation.y=mix(a.rotationFrom,a.rotationTo,u);o.parts.forEach(({mesh,home},i)=>{mesh.position.copy(home);mesh.position.x+=(i-(o.parts.length-1)/2)*.35*spread;mesh.position.z+=Math.sin(i*2)*.65*spread;mesh.material.transparent=true;mesh.material.opacity=opacity;});}
const box=new T.Box3();for(const {o} of entries)if(o.group.visible)box.union(new T.Box3().setFromObject(o.group));if(!box.isEmpty()){const c=box.getCenter(new T.Vector3()),r=box.getBoundingSphere(new T.Sphere()).radius,dist=Math.max(5,r/Math.sin(.14));camera.position.set(c.x+Math.sin(t*.2)*dist*.12,c.y,c.z+dist);camera.lookAt(c);camera.updateMatrixWorld();}else{camera.position.set(0,0,8);camera.lookAt(0,0,0);}
for(const {o,label} of entries)if(o.group.visible){const v=new T.Box3().setFromObject(o.group).getCenter(new T.Vector3()).project(camera);const slot=s.active_ids.indexOf(entries.find(e=>e.o===o).spec.id);label.style.left=(s.active_ids.length===1?540:slot%2===0?280:800)+'px';label.style.top=(s.active_ids.length<=2?1320:Math.floor(slot/2)===0?730:1320)+'px';}
const title=document.querySelector('#title');title.textContent=s.spoken_text.split(/\\s+/).slice(0,6).join(" ");title.style.color=new T.Color(cfg.background).getHSL({h:0,s:0,l:0}).l>.55?'#15283b':'#fff';const wi=words.findIndex(w=>t>=w.start&&t<w.end);const cap=document.querySelector('#caption');cap.textContent=wi<0?'':words.slice(Math.max(0,wi-2),wi+3).map(w=>w.word).join(' ');cap.style.color=title.style.color;const occupied=[];for(const {o,label} of entries){if(!o.group.visible)continue;const b=new T.Box3().setFromObject(o.group),pts=[];for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const z of [b.min.z,b.max.z]){const v=new T.Vector3(x,y,z).project(camera);pts.push([(v.x*.5+.5)*1080,(.5-v.y*.5)*1920]);}occupied.push({left:Math.min(...pts.map(p=>p[0])),right:Math.max(...pts.map(p=>p[0])),top:Math.min(...pts.map(p=>p[1])),bottom:Math.max(...pts.map(p=>p[1]))});}window.__jackGeometry=occupied.slice();const overlap=(a,b)=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;for(const {label} of entries){if(label.hidden)continue;const rect=label.getBoundingClientRect(),base=document.querySelector("#main").getBoundingClientRect(),r={left:rect.left-base.left,right:rect.right-base.left,top:rect.top-base.top,bottom:rect.bottom-base.top};if(r.left<80||r.right>1000||r.top<380||r.bottom>1500||occupied.some(b=>overlap(r,b)))label.hidden=true;else occupied.push(r);}renderer.render(scene,camera);}
const state={t:0},tl=gsap.timeline({paused:true});tl.to(state,{t:duration,duration,ease:'none',onUpdate:()=>draw(state.t)});window.__timelines={main:tl};window.__jackInspect=t=>{draw(t);return {geometry:window.__jackGeometry,hiddenLabels:entries.filter(e=>e.o.group.visible&&e.label.hidden).map(e=>e.spec.id)};};draw(0);
</script></body></html>
