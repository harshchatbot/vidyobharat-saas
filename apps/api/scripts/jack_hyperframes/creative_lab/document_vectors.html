<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#080b12}#main{position:relative;width:1080px;height:1920px;overflow:hidden;background:#080b12;color:#fff;font-family:Arial,sans-serif}canvas{position:absolute;inset:0;width:1080px;height:1920px}#eyebrow{position:absolute;top:130px;left:90px;font:28px monospace;letter-spacing:5px;color:#f4ad75}#title{position:absolute;left:90px;top:260px;width:900px;font-size:100px;line-height:1;font-weight:800;letter-spacing:-5px}#sub{position:absolute;left:90px;bottom:250px;width:900px;font-size:42px;color:#b9c8d8}#progress{position:absolute;left:90px;bottom:160px;height:4px;background:#f4ad75;width:0}
</style></head><body><div id="main" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920"><canvas id="stage"></canvas><div id="eyebrow">JACK / MOTION LAB 01</div><div id="title"></div><div id="sub"></div><div id="progress"></div></div><script src="./vendor/gsap.min.js"></script><script type="module">
import * as THREE from './vendor/three.module.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#stage'),antialias:true,alpha:false,preserveDrawingBuffer:true});renderer.setSize(1080,1920,false);renderer.setPixelRatio(1);renderer.setClearColor(0x080b12);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1080/1920,.1,100);scene.add(new THREE.HemisphereLight(0xb8d9ff,0x442211,2));const key=new THREE.DirectionalLight(0xffbd83,4);key.position.set(4,6,5);scene.add(key);const rim=new THREE.PointLight(0x4488ff,65,25);rim.position.set(-5,2,-3);scene.add(rim);
const group=new THREE.Group();scene.add(group);const material=new THREE.MeshStandardMaterial({color:0xd9a06b,metalness:.55,roughness:.3});const pages=[];for(let i=0;i<6;i++){const page=new THREE.Mesh(new THREE.BoxGeometry(3.1,1.9,.07),material);group.add(page);pages.push(page);for(let j=0;j<5;j++){const line=new THREE.Mesh(new THREE.BoxGeometry(1.9-j*.13,.035,.012),new THREE.MeshStandardMaterial({color:0x29364b}));line.position.set(-.25,.6-j*.24,.045);page.add(line);}}
const count=1200,positions=new Float32Array(count*3),geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));const points=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffc17b,size:.045,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(points);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.8,.035,12,100),new THREE.MeshStandardMaterial({color:0x81c8ff,emissive:0x2266aa,emissiveIntensity:2,transparent:true,opacity:0}));scene.add(ring);
const clamp=x=>Math.max(0,Math.min(1,x)),ease=gsap.parseEase('power3.inOut'),mix=(a,b,t)=>a+(b-a)*t;
const title=document.querySelector('#title'),sub=document.querySelector('#sub'),progress=document.querySelector('#progress');
function draw(t){const split=ease(clamp((t-.6)/2)),morph=ease(clamp((t-3)/2)),query=ease(clamp((t-6)/1.5));camera.position.set(mix(3,-2,morph)+Math.sin(t*.6)*.5,2.5,10-query*1.4);camera.lookAt(0,0,0);group.rotation.set(-.25+split*.35,t*.12,.1);pages.forEach((p,i)=>{p.position.set((i-2.5)*split*.48,(i-2.5)*split*.46,(i-2.5)*(.09+split*.25));p.rotation.z=(i-2.5)*split*.09;p.scale.setScalar(Math.max(.001,1-morph));p.visible=morph<.999;});for(let i=0;i<count;i++){const a=i*2.399963,r=Math.sqrt((i+.5)/count)*2.4,cluster=i%3-1;const x=Math.cos(a)*r,y=Math.sin(a)*r,z=Math.sin(i*1.37)*1.1;positions[i*3]=mix(Math.sin(i*7.1)*1.6,x+cluster*.65,morph);positions[i*3+1]=mix(Math.cos(i*3.7)*1.4,y,morph);positions[i*3+2]=mix((i%6-2.5)*.32,z,morph);}geo.attributes.position.needsUpdate=true;points.material.opacity=morph;points.rotation.y=t*.13;ring.material.opacity=query;ring.position.set(0,0,1.3-query*2);ring.scale.setScalar(.6+query*.5);ring.rotation.x=.2;const phase=t<3?0:t<6?1:2;title.textContent=['Documents.','Vector space.','Find meaning.'][phase];sub.textContent=['Break knowledge into usable fragments.','Represent meaning as numerical vectors.','Retrieve relevant context for the model.'][phase];const local=t-phase*3;title.style.opacity=String(clamp(local*5));title.style.transform='translateY('+((1-ease(clamp(local*3)))*55)+'px)';progress.style.width=(900*t/9)+'px';renderer.render(scene,camera);}
const state={t:0},tl=gsap.timeline({paused:true});tl.to(state,{t:9,duration:9,ease:'none',onUpdate:()=>draw(state.t)});window.__timelines={main:tl};draw(0);
</script></body></html>
