<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f8f5ef;font-family:Inter,Arial,sans-serif}#main{width:1080px;height:1920px;position:relative;overflow:hidden;background:#101114}.brand{position:absolute;top:120px;left:90px;font-size:32px;font-weight:700;letter-spacing:5px;color:#ff9360}.scene{position:absolute;inset:230px 90px 440px;display:flex;flex-direction:column;justify-content:center;gap:42px}.eyebrow{font-size:32px;letter-spacing:4px;color:#ff9360;font-weight:700}.headline{font-size:106px;font-weight:900;line-height:1.04;overflow-wrap:anywhere;letter-spacing:-3px}.headline span{display:inline-block;margin-right:20px}.visual{max-height:640px;display:flex;flex-direction:column;gap:22px}.visual img{width:100%;max-height:610px;object-fit:contain;border-radius:20px}.node{font-size:54px;font-weight:700;border-left:8px solid #ff9360;padding:20px 30px;background:#ffffff0b;overflow-wrap:anywhere}.code{font:42px monospace;line-height:1.4;color:#b5d5ff;white-space:pre-wrap;overflow-wrap:anywhere}.rule{height:6px;background:#ff9360;transform-origin:left}.counter{position:absolute;bottom:230px;left:90px;font:28px monospace;color:#a6a6a6}.progress{position:absolute;bottom:190px;left:90px;width:900px;height:4px;background:#ffffff22}.progress i{display:block;height:100%;background:#ff9360;transform-origin:left}.caption{position:absolute;bottom:310px;left:90px;width:900px;text-align:center;font-size:48px;line-height:1.2;font-weight:650}.caption span{display:inline-block;margin:0 6px}.wash{position:absolute;inset:0;background:radial-gradient(ellipse at 90% 20%,#28375c55,transparent 60%);pointer-events:none}
.detail{font-size:44px;line-height:1.2;color:#b9c3d4}.repo{padding:36px;background:#182231;border:2px solid #54667c;border-radius:24px;font:42px monospace;overflow-wrap:anywhere}.reaction{font-size:180px;line-height:1;color:#ff9360}.scene[data-layout="comparison"] .visual{flex-direction:row}.scene[data-layout="comparison"] .node{flex:1;font-size:42px}.scene[data-layout="reaction"] .headline{font-size:118px}.scene[data-layout="github_reveal"] .headline{font-size:84px}.scene[data-layout="product_demo"] .headline{font-size:72px}.scene[data-layout="product_demo"] .visual img{max-height:460px}.scene[data-layout="workflow"] .headline{font-size:78px}.scene[data-layout="comparison"] .headline{font-size:82px}.scene[data-layout="hero_title"] .headline{font-size:100px}.scene[data-layout="github_reveal"] .repo{background:#e8edf3;color:#142133;border:0;box-shadow:0 24px 70px #0007}.repo-mark{font:700 25px Arial;letter-spacing:3px;color:#526175;margin-bottom:22px}.scene[data-layout="reaction"] .reaction{transform:rotate(-8deg);text-shadow:12px 12px #783b28}.scene[data-layout="comparison"] .node:nth-child(2){border-color:#7faaff;background:#22304a}.scene[data-layout="workflow"] .node:not(:last-child)::after{content:"↓";display:block;color:#ff9360;font-size:30px;margin-top:8px}.scene[data-layout="hero_title"] .headline{letter-spacing:-5px}.headline span{max-width:100%;overflow-wrap:anywhere}.detail{max-width:100%;overflow-wrap:anywhere}.transition-fx{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0}.wash{background:radial-gradient(ellipse at 85% 20%,#364b8055,transparent 60%),repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 90px)}.scene[data-layout="reaction"] .visual{align-items:center}.scene[data-layout="reaction"] .visual img{max-height:540px;object-fit:contain}.scene[data-layout="github_reveal"] .repo{transform:perspective(1200px) rotateY(-5deg)}.scene[data-layout="workflow"] .node{border-radius:12px;background:linear-gradient(110deg,#27374a,#161b24)}.scene[data-layout="comparison"] .node{min-width:0}.scene[data-layout="hero_title"] .headline{font-family:Impact,'Arial Narrow',Arial,sans-serif;font-weight:900;letter-spacing:-1px}.caption{font-family:Arial,sans-serif;text-shadow:0 3px 12px #000}.visual{transform-origin:center}__FONT_CSS__
.headline{font-family:EditorialDisplay,Impact,Arial,sans-serif}.detail,.caption,.node{font-family:EditorialBody,Arial,sans-serif}.scene[data-layout="hero_title"] .headline{font-family:EditorialDisplay,Impact,Arial,sans-serif}.graphic{width:100%;height:420px;overflow:visible}.graphic text{font-family:EditorialBody,Arial,sans-serif;font-size:30px;font-weight:700}.scene[data-layout="workflow"] .visual{max-height:500px}.scene[data-layout="reaction"] .reaction{font-family:EditorialDisplay,Impact,sans-serif}.scene[data-layout="github_reveal"] .repo{border-top:12px solid #ff9360}.scene[data-layout="comparison"] .node{border-top:4px solid #ff9360;border-left:0;padding:30px 18px}.scene[data-layout="hero_title"] .visual:empty{display:none}</style></head><body><div id="main" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920"><div class="wash"></div><div class="brand">JACK / AI TECH</div><div class="scene"></div><div class="caption"></div><div class="transition-fx"></div><div class="counter"></div><div class="progress"><i></i></div></div><script src="./vendor/gsap.min.js"></script><script>
const shots=__SHOTS__,products=__PRODUCTS__,words=__WORDS__,duration=__DURATION__;
const scene=document.querySelector('.scene'),caption=document.querySelector('.caption'),counter=document.querySelector('.counter');
const el=(tag,cls,txt)=>{const e=document.createElement(tag);e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3);
let current=-1;
function workflow(items){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 900 420');svg.setAttribute('class','graphic');const add=(tag,attrs,txt)=>{const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(txt)n.textContent=txt;svg.append(n);return n};items.forEach((label,i)=>{const y=65+i*140;if(i>0)add('path',{d:'M450 '+(y-105)+' V'+(y-38),stroke:'#ff9360','stroke-width':5,'stroke-dasharray':'9 7',class:'connector'});add('rect',{x:100,y:y-38,width:700,height:92,rx:18,fill:'#24354c',stroke:'#6385a8','stroke-width':2,class:'step'});add('circle',{cx:145,cy:y+8,r:24,fill:'#ff9360',class:'step'});add('text',{x:145,y:y+18,'text-anchor':'middle',fill:'#101114',class:'step'},String(i+1));add('text',{x:190,y:y+18,fill:'#f8f5ef',class:'step'},label)});return svg}

function build(s,i){scene.replaceChildren();scene.dataset.layout=s.template;scene.append(el('div','eyebrow',s.template==='product_demo'?'PRODUCT IN FOCUS':s.template==='workflow'?'HOW IT WORKS':'AI TECHNOLOGY'));
const h=el('div','headline');for(const w of s.headline.split(/\s+/))h.append(el('span','',w));scene.append(h,el('div','rule'));
const v=el('div','visual');if(s.template==='product_demo'){const a=products[s.product_asset];if(!a||a.kind!=='image')throw Error('Expected approved still image');const img=el('img','');img.src=a.src;v.append(img)}else if(s.template==='workflow'){v.append(workflow(s.items))}else if(s.template==='github_reveal'){const card=el('div','repo');card.append(el('div','repo-mark','GITHUB / REPOSITORY'),el('div','',s.detail));v.append(card)}else if(s.template==='comparison'){for(const w of s.items)v.append(el('div','node',w))}else if(s.template==='reaction'){const a=products[s.product_asset];if(a&&a.kind==='image'){const img=el('img','');img.src=a.src;v.append(img)}else{v.append(el('div','reaction','?!'))}}scene.append(v);if(s.detail&&s.template!=='github_reveal')scene.append(el('div','detail',s.detail));while(scene.scrollHeight>scene.clientHeight&&parseFloat(getComputedStyle(h).fontSize)>48)h.style.fontSize=(parseFloat(getComputedStyle(h).fontSize)-4)+'px';counter.textContent=String(i+1).padStart(2,'0')+' / '+String(shots.length).padStart(2,'0')}
function draw(t){const f=Math.min(Math.floor(t*30+1e-5),Math.round(duration*30)-1),i=shots.findIndex(s=>f>=s.start_frame&&f<s.end_frame);if(i<0)return;const s=shots[i],local=(f-s.start_frame)/30,len=(s.end_frame-s.start_frame)/30;if(current!==i){build(s,i);current=i}const enter=ease(local/.25),exit=clamp((len-local)/.16);scene.style.opacity=exit;scene.style.clipPath='inset(0 0 '+((1-enter)*100)+'% 0)';scene.style.transform='translateY('+((1-enter)*28)+'px)';scene.querySelectorAll('.headline span').forEach((e,j)=>{const p=ease((local-j*.08)/.24);e.style.opacity=p;e.style.transform=s.typography==='word_slam'?'scale('+(1+.2*(1-p))+')':'translateY('+((1-p)*35)+'px)';e.style.color=(s.typography==='highlight_wipe'?p>.85&&j===0:j===0)?'#ff9360':'#f8f5ef'});scene.querySelector('.rule').style.transform='scaleX('+ease(local/.5)+')';const v=scene.querySelector('.visual');v.style.transform='scale('+(s.camera==='pull_back'?1.04-.04*local/len:1+.04*local/len)+')';let pulse=0;for(const e of s.events){const age=f-e.frame;if(age>=0&&age<9)pulse=Math.max(pulse,1-age/9)}v.style.filter='brightness('+(1+.15*pulse)+')';v.querySelectorAll('.node').forEach((n,j)=>{const p=ease((local-.15-j*.16)/.3);n.style.opacity=p;n.style.transform='translateX('+((1-p)*60)+'px)'});v.querySelectorAll('.step,.connector').forEach((n,j)=>{n.style.opacity=ease((local-.1-j*.055)/.25)});const fx=document.querySelector('.transition-fx'),edge=Math.max(0,1-local/.22),tail=Math.max(0,1-(len-local)/.16),q=Math.max(edge,tail);fx.style.opacity=0;fx.style.background='none';scene.style.filter='none';scene.style.clipPath='none';const tr=s.transition||'mask';if(tr==='whip'){scene.style.transform='translateX('+((edge-tail)*190)+'px)';scene.style.filter='blur('+(q*9)+'px)'}else if(tr==='glitch'){scene.style.transform='translateX('+(Math.sin(f*2.7)*q*18)+'px)';scene.style.filter='hue-rotate('+(q*35)+'deg)';fx.style.background='repeating-linear-gradient(0deg,transparent 0 25px,#5bcfff55 26px 29px)';fx.style.opacity=q*.5}else if(tr==='zoom'){scene.style.transform='scale('+(1+q*.16)+')';scene.style.filter='blur('+(q*4)+'px)'}else if(tr==='light'){fx.style.background='linear-gradient(110deg,transparent,#ffb16b,transparent)';fx.style.opacity=q*.65}else if(tr==='mask'){scene.style.clipPath='inset(0 0 '+(edge*100)+'% 0)'}if(s.effect==='shake'&&pulse>0)v.style.transform+=' translateX('+(Math.sin(f*2)*pulse*14)+'px)';if(s.effect==='glow')v.style.filter+=' drop-shadow(0 0 '+(pulse*22)+'px #ff9360)';if(s.effect==='punch')v.style.transform+=' scale('+(1+pulse*.09)+')';let wi=words.findIndex(w=>t>=w.start&&t<w.end);if(wi<0)wi=words.findLastIndex(w=>w.start<=t);caption.replaceChildren();if(wi>=0&&t-words[wi].end<.45){const start=Math.floor(wi/4)*4;for(let j=start;j<Math.min(start+4,words.length);j++){const e=el('span','',words[j].word);e.style.color=j===wi?'#ff9360':'#f8f5ef';caption.append(e)}}document.querySelector('.progress i').style.transform='scaleX('+clamp(t/duration)+')'}
const state={t:0},tl=gsap.timeline({paused:true});tl.to(state,{t:duration,duration,ease:'none',onUpdate:()=>draw(state.t)});window.__timelines={main:tl};draw(0);
</script></body></html>
