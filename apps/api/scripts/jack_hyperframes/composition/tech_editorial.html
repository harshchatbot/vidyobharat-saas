<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f8f5ef;font-family:Inter,Arial,sans-serif}#main{width:1080px;height:1920px;position:relative;overflow:hidden;background:#101114}.brand{position:absolute;top:120px;left:90px;font-size:32px;font-weight:700;letter-spacing:5px;color:#ff9360}.scene{position:absolute;inset:230px 90px 440px;display:flex;flex-direction:column;justify-content:center;gap:42px}.eyebrow{font-size:32px;letter-spacing:4px;color:#ff9360;font-weight:700}.headline{font-size:106px;font-weight:900;line-height:1.04;overflow-wrap:anywhere;letter-spacing:-3px}.headline span{display:inline-block;margin-right:20px}.visual{max-height:640px;display:flex;flex-direction:column;gap:22px}.visual img{width:100%;max-height:610px;object-fit:contain;border-radius:20px}.node{font-size:54px;font-weight:700;border-left:8px solid #ff9360;padding:20px 30px;background:#ffffff0b;overflow-wrap:anywhere}.code{font:42px monospace;line-height:1.4;color:#b5d5ff;white-space:pre-wrap;overflow-wrap:anywhere}.rule{height:6px;background:#ff9360;transform-origin:left}.counter{position:absolute;bottom:230px;left:90px;font:28px monospace;color:#a6a6a6}.progress{position:absolute;bottom:190px;left:90px;width:900px;height:4px;background:#ffffff22}.progress i{display:block;height:100%;background:#ff9360;transform-origin:left}.caption{position:absolute;bottom:310px;left:90px;width:900px;text-align:center;font-size:48px;line-height:1.2;font-weight:650}.caption span{display:inline-block;margin:0 6px}.wash{position:absolute;inset:0;background:radial-gradient(ellipse at 90% 20%,#28375c55,transparent 60%);pointer-events:none}
.detail{font-size:44px;line-height:1.2;color:#b9c3d4}.repo{padding:36px;background:#182231;border:2px solid #54667c;border-radius:24px;font:42px monospace;overflow-wrap:anywhere}.reaction{font-size:180px;line-height:1;color:#ff9360}.scene[data-layout="comparison"] .visual{flex-direction:row}.scene[data-layout="comparison"] .node{flex:1;font-size:42px}.scene[data-layout="reaction"] .headline{font-size:118px}.scene[data-layout="github_reveal"] .headline{font-size:84px}.scene[data-layout="product_demo"] .headline{font-size:72px}.scene[data-layout="product_demo"] .visual img{max-height:460px}.scene[data-layout="workflow"] .headline{font-size:78px}.scene[data-layout="comparison"] .headline{font-size:82px}.scene[data-layout="hero_title"] .headline{font-size:100px}.scene[data-layout="github_reveal"] .repo{background:#e8edf3;color:#142133;border:0;box-shadow:0 24px 70px #0007}.repo-mark{font:700 25px Arial;letter-spacing:3px;color:#526175;margin-bottom:22px}.scene[data-layout="reaction"] .reaction{transform:rotate(-8deg);text-shadow:12px 12px #783b28}.scene[data-layout="comparison"] .node:nth-child(2){border-color:#7faaff;background:#22304a}.scene[data-layout="workflow"] .node:not(:last-child)::after{content:"↓";display:block;color:#ff9360;font-size:30px;margin-top:8px}.scene[data-layout="hero_title"] .headline{letter-spacing:-5px}.headline span{max-width:100%;overflow-wrap:anywhere}.detail{max-width:100%;overflow-wrap:anywhere}</style></head><body><div id="main" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920"><div class="wash"></div><div class="brand">JACK / AI TECH</div><div class="scene"></div><div class="caption"></div><div class="counter"></div><div class="progress"><i></i></div></div><script src="./vendor/gsap.min.js"></script><script>
const shots=__SHOTS__,products=__PRODUCTS__,words=__WORDS__,duration=__DURATION__;
const scene=document.querySelector('.scene'),caption=document.querySelector('.caption'),counter=document.querySelector('.counter');
const el=(tag,cls,txt)=>{const e=document.createElement(tag);e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3);
let current=-1;
function build(s,i){scene.replaceChildren();scene.dataset.layout=s.template;scene.append(el('div','eyebrow',s.template==='product_demo'?'PRODUCT IN FOCUS':s.template==='workflow'?'HOW IT WORKS':'AI TECHNOLOGY'));
const h=el('div','headline');for(const w of s.headline.split(/\s+/))h.append(el('span','',w));scene.append(h,el('div','rule'));
const v=el('div','visual');if(s.template==='product_demo'){const a=products[s.product_asset];if(!a||a.kind!=='image')throw Error('Expected approved still image');const img=el('img','');img.src=a.src;v.append(img)}else if(s.template==='workflow'){for(const w of s.items)v.append(el('div','node',w))}else if(s.template==='github_reveal'){const card=el('div','repo');card.append(el('div','repo-mark','GITHUB / REPOSITORY'),el('div','',s.detail));v.append(card)}else if(s.template==='comparison'){for(const w of s.items)v.append(el('div','node',w))}else if(s.template==='reaction'){v.append(el('div','reaction','?!'))}scene.append(v);if(s.detail&&s.template!=='github_reveal')scene.append(el('div','detail',s.detail));while(scene.scrollHeight>scene.clientHeight&&parseFloat(getComputedStyle(h).fontSize)>48)h.style.fontSize=(parseFloat(getComputedStyle(h).fontSize)-4)+'px';counter.textContent=String(i+1).padStart(2,'0')+' / '+String(shots.length).padStart(2,'0')}
function draw(t){const f=Math.min(Math.floor(t*30+1e-5),Math.round(duration*30)-1),i=shots.findIndex(s=>f>=s.start_frame&&f<s.end_frame);if(i<0)return;const s=shots[i],local=(f-s.start_frame)/30,len=(s.end_frame-s.start_frame)/30;if(current!==i){build(s,i);current=i}const enter=ease(local/.25),exit=clamp((len-local)/.16);scene.style.opacity=exit;scene.style.clipPath='inset(0 0 '+((1-enter)*100)+'% 0)';scene.style.transform='translateY('+((1-enter)*28)+'px)';scene.querySelectorAll('.headline span').forEach((e,j)=>{const p=ease((local-j*.08)/.24);e.style.opacity=p;e.style.transform=s.typography==='word_slam'?'scale('+(1+.2*(1-p))+')':'translateY('+((1-p)*35)+'px)';e.style.color=(s.typography==='highlight_wipe'?p>.85&&j===0:j===0)?'#ff9360':'#f8f5ef'});scene.querySelector('.rule').style.transform='scaleX('+ease(local/.5)+')';const v=scene.querySelector('.visual');v.style.transform='scale('+(s.camera==='pull_back'?1.04-.04*local/len:1+.04*local/len)+')';let pulse=0;for(const e of s.events){const age=f-e.frame;if(age>=0&&age<9)pulse=Math.max(pulse,1-age/9)}v.style.filter='brightness('+(1+.15*pulse)+')';v.querySelectorAll('.node').forEach((n,j)=>{const p=ease((local-.15-j*.16)/.3);n.style.opacity=p;n.style.transform='translateX('+((1-p)*60)+'px)'});let wi=words.findIndex(w=>t>=w.start&&t<w.end);if(wi<0)wi=words.findLastIndex(w=>w.start<=t);caption.replaceChildren();if(wi>=0&&t-words[wi].end<.45){const start=Math.floor(wi/4)*4;for(let j=start;j<Math.min(start+4,words.length);j++){const e=el('span','',words[j].word);e.style.color=j===wi?'#ff9360':'#f8f5ef';caption.append(e)}}document.querySelector('.progress i').style.transform='scaleX('+clamp(t/duration)+')'}
const state={t:0},tl=gsap.timeline({paused:true});tl.to(state,{t:duration,duration,ease:'none',onUpdate:()=>draw(state.t)});window.__timelines={main:tl};draw(0);
</script></body></html>
