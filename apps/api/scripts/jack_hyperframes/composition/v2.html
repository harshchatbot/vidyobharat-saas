<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#07060d;color:#f5f2ee;font-family:Arial,sans-serif}#main{width:1080px;height:1920px;overflow:hidden;position:relative;perspective:1300px;background:#07060d}.world{position:absolute;inset:0;transform-style:preserve-3d}.bg{position:absolute;inset:-180px;background:radial-gradient(ellipse at 15% 30%,#59260f,transparent 55%),radial-gradient(ellipse at 90% 65%,#152e79,transparent 55%),repeating-linear-gradient(90deg,transparent 0 79px,#ffffff0b 80px 81px),repeating-linear-gradient(0deg,transparent 0 79px,#ffffff0b 80px 81px);transform:translateZ(-250px)}.hero{position:absolute;left:90px;top:410px;width:900px;height:690px;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}.panel{width:100%;padding:45px;border:2px solid #7599ff88;border-radius:32px;background:linear-gradient(135deg,#202b43,#10111d);box-shadow:0 30px 100px #0009,inset 0 0 45px #3b6cff22}.bar{display:flex;gap:12px;margin-bottom:36px}.bar i{width:16px;height:16px;background:#ff6b35;border-radius:50%}.label{font-size:30px;letter-spacing:5px;color:#8daaff}.large{font-size:82px;font-weight:800;overflow-wrap:anywhere}.headline{position:absolute;top:1150px;left:85px;width:910px;font-size:96px;line-height:1.04;font-weight:900;text-align:center;text-shadow:0 8px 25px #000}.brand{position:absolute;top:130px;left:85px;font-size:32px;letter-spacing:8px;color:#ff6b35}.fx{position:absolute;inset:0;pointer-events:none;transform:translateZ(110px)}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#ffad75;box-shadow:0 0 22px #ff6b35}.node{padding:25px;border:2px solid #7197ff;border-radius:20px;font-size:42px;text-align:center}.arrow{text-align:center;color:#ff6b35;font-size:50px}.code{font:36px monospace;white-space:pre-wrap;line-height:1.7;color:#b9d4ff}.pulse{position:absolute;inset:0;border:4px solid #ff6b35;border-radius:32px;pointer-events:none}
.mascot{position:absolute;left:35px;top:470px;width:620px;height:744px;object-fit:contain;transform-origin:50% 85%;pointer-events:none;filter:drop-shadow(0 18px 22px #0008)}.hero.with-mascot{left:420px;width:580px}.hero.with-mascot .large{font-size:58px}.hero.with-mascot .node{font-size:32px}</style></head><body><div id="main" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920"><div class="world"><div class="bg"></div><div class="hero"></div><img class="mascot" alt="" style="display:none"><div class="fx"></div></div><div class="brand">JACK / AI TECH</div><div class="headline"></div></div><script src="./vendor/gsap.min.js"></script><script>
const shots=__SHOTS__, duration=__DURATION__, hero=document.querySelector('.hero'), world=document.querySelector('.world'), bg=document.querySelector('.bg'), headline=document.querySelector('.headline'), fx=document.querySelector('.fx');
const el=(tag,cls,text)=>{const e=document.createElement(tag);e.className=cls;if(text!==undefined)e.textContent=text;return e};
for(let i=0;i<32;i++){let p=el('i','spark');p.style.left=(i*173%1080)+'px';p.style.top=(i*317%1920)+'px';fx.append(p)}
const mascot=document.querySelector(".mascot");let current=-1;
function build(s){const visible=s.mascot&&s.mascot!=="hidden";mascot.style.display=visible?"block":"none";if(visible)mascot.src="assets/jack-v2/"+s.mascot+".png";hero.classList.toggle("with-mascot",!!visible);hero.replaceChildren();const p=el('div','panel'),bar=el('div','bar');for(let i=0;i<3;i++)bar.append(el('i',''));p.append(bar);
if(s.template==='code_editor'){p.append(el('div','label','COMPOSITION'),el('div','code',s.headline));}
else if(s.template==='workflow'){for(const [i,w] of s.headline.split(/\s+/).slice(0,3).entries()){if(i)p.append(el('div','arrow','↓'));p.append(el('div','node',w));}}
else if(s.template==='hero_title'){p.append(el('div','label','AI TECHNOLOGY'),el('div','large',s.headline));}
else throw Error('Unsupported template '+s.template);
p.append(el('div','pulse'));hero.append(p);headline.textContent=s.template==='hero_title'?'':s.headline;}
function draw(t){const f=Math.min(Math.floor(t*30+0.00001),Math.round(duration*30)-1);const i=shots.findIndex(s=>f>=s.start_frame&&f<s.end_frame);if(i<0)return;const s=shots[i];if(i!==current){build(s);current=i}const u=(f-s.start_frame)/Math.max(1,s.end_frame-s.start_frame-1),v=u*u*(3-2*u);
const camera={dolly_in:[0,0,1+v*.13],pull_back:[0,0,1.13-v*.13],pan_parallax:[-5+10*v,0,1.04]}[s.camera];if(!camera)throw Error('Unsupported camera');
world.style.transform='rotateY('+camera[0]+'deg) scale('+camera[2]+')';bg.style.transform='translateZ(-250px) translateX('+(-30*v)+'px)';hero.style.transform='translateY('+Math.sin(u*Math.PI*2)*12+'px) rotateY('+(-6+12*v)+'deg)';fx.style.transform='translateZ(110px) translateY('+(-65*v)+'px)';
mascot.style.transform="translateZ(65px) translateY("+(-12*Math.sin(u*Math.PI))+"px) rotate("+(-2+4*v)+"deg)";let strength=0;for(const e of s.events){if(e.type!=='pulse')throw Error('Unsupported event');const age=f-e.frame;if(age>=0&&age<12)strength=Math.max(strength,1-age/12)}hero.querySelector('.pulse').style.opacity=strength;hero.querySelector('.panel').style.filter='brightness('+(1+strength*.25)+')';headline.style.opacity=Math.min(1,u*12);headline.style.transform='translateY('+Math.max(0,28-u*336)+'px)';}
const state={t:0},tl=gsap.timeline({paused:true});tl.to(state,{t:duration,duration,ease:'none',onUpdate:()=>draw(state.t)});window.__timelines={main:tl};draw(0);
</script></body></html>
