<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#080910;color:white;font-family:Arial,sans-serif}#main{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{position:absolute;inset:0}#brand{position:absolute;top:110px;left:80px;font-size:36px;letter-spacing:5px;color:#ff9b65}#caption{position:absolute;bottom:340px;left:90px;width:900px;text-align:center;font-size:62px;font-weight:800;line-height:1.2;text-shadow:0 3px 12px black}#caption span{display:inline-block;margin:0 7px}
</style></head><body><div id="main" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920"><div id="brand">JACK / AI TECH</div><div id="caption"></div></div>
<script src="./vendor/gsap.min.js"></script><script type="module">
import * as T from './vendor/three.module.js';
import {GLTFLoader} from './vendor/GLTFLoader.js';
const shots=__SHOTS__, words=__WORDS__, duration=__DURATION__;
const scene=new T.Scene();scene.background=new T.Color(0x080910);scene.fog=new T.FogExp2(0x080910,.035);
const camera=new T.PerspectiveCamera(38,1080/1920,.1,100);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1080,1920);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;document.querySelector('#main').prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xaacaff,0x352014,2));
for(const [color,x,z] of [[0xff7733,-4,3],[0x397aff,4,-2]]){const l=new T.PointLight(color,65,25);l.position.set(x,4,z);scene.add(l)}
const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x111724,roughness:.65}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new T.GridHelper(100,100,0x466ca0,0x243653);grid.position.y=.012;scene.add(grid);
const stage=new T.Mesh(new T.CylinderGeometry(2.2,2.4,.18,64),new T.MeshStandardMaterial({color:0x202638,metalness:.6,roughness:.3}));stage.position.y=.09;scene.add(stage);
const ring=new T.Mesh(new T.TorusGeometry(2.15,.025,8,96),new T.MeshBasicMaterial({color:0xff7733}));ring.rotation.x=Math.PI/2;ring.position.y=.19;scene.add(ring);
const actor=new T.Group();actor.position.set(-.65,.2,0);scene.add(actor);
const loader=new GLTFLoader();
const models={};
for(const role of ['talking','walking']){
 const g=await loader.loadAsync(__MODELS__[role]);
 if(!g.animations.length)throw Error('Missing animation '+role);
 const root=g.scene, box=new T.Box3().setFromObject(root), size=box.getSize(new T.Vector3()), center=box.getCenter(new T.Vector3());
 const wrapper=new T.Group();wrapper.add(root);root.position.sub(center);root.position.y+=size.y/2;wrapper.scale.setScalar(2.7/size.y);actor.add(wrapper);
 const mixer=new T.AnimationMixer(root),clip=g.animations[0];mixer.clipAction(clip).play();models[role]={wrapper,mixer,clip};
}
const demo=new T.Group();demo.position.set(1.1,1.8,-.6);scene.add(demo);
const cube=new T.Mesh(new T.BoxGeometry(1.1,1.1,1.1),new T.MeshStandardMaterial({color:0x357bff,metalness:.45,roughness:.28}));demo.add(cube);
const edges=new T.LineSegments(new T.EdgesGeometry(cube.geometry),new T.LineBasicMaterial({color:0xffaa66}));cube.add(edges);
const orbit=new T.Mesh(new T.TorusGeometry(1.1,.018,8,80),new T.MeshBasicMaterial({color:0x64aaff}));demo.add(orbit);
const pillars=[];for(let i=0;i<12;i++){const p=new T.Mesh(new T.BoxGeometry(.12,2+(i%3),.12),new T.MeshBasicMaterial({color:i%2?0x294d88:0x733a24}));p.position.set((i%2?1:-1)*(3+i%3),1,-2-Math.floor(i/2)*2);scene.add(p);pillars.push(p)}
const caption=document.querySelector('#caption');let last='';
function draw(t){const f=Math.min(Math.floor(t*30+1e-5),Math.round(duration*30)-1);const i=shots.findIndex(s=>f>=s.start_frame&&f<s.end_frame);if(i<0)return;const s=shots[i],u=(f-s.start_frame)/Math.max(1,s.end_frame-s.start_frame-1),v=u*u*(3-2*u);
const mode=i%4;let angle=0,r=7.5,h=2.5,fov=38;
if(mode===0){angle=-.48+.96*v;r=7.4}else if(mode===1){angle=.2;r=8.8-3*v}else if(mode===2){angle=.38-.76*v;r=6.4+2*v;h=2.1+v}else{angle=-.2;r=7.4;fov=44-12*v}
camera.position.set(Math.sin(angle)*r,h,Math.cos(angle)*r);camera.fov=fov;camera.updateProjectionMatrix();camera.lookAt(0,1.65,0);
actor.visible=true;const role=i===0?'walking':'talking';for(const [name,m] of Object.entries(models)){m.wrapper.visible=name===role;if(m.wrapper.visible)m.mixer.setTime(name==='walking'?Math.min(t,m.clip.duration-.001):t%m.clip.duration)}actor.position.set(i===0?-1.2+v*.55:-.65,.2,0);actor.rotation.y=i===0?.25:0;
demo.visible=s.template!=='hero_title';cube.rotation.set(t*.55,t*.8,t*.23);orbit.rotation.set(t*.35,t*.2,0);demo.position.y=1.8+.12*Math.sin(t*2);
const wi=words.findIndex(w=>t>=w.start&&t<w.end);const start=wi<0?-1:Math.floor(wi/4)*4;const key=start+':'+wi;if(key!==last){caption.replaceChildren();if(start>=0)for(let j=start;j<Math.min(start+4,words.length);j++){const e=document.createElement('span');e.textContent=words[j].word;e.style.color=j===wi?'#ffad75':'#fff';caption.append(e)}last=key}
renderer.render(scene,camera)}
const state={t:0},tl=gsap.timeline({paused:true});tl.to(state,{t:duration,duration,ease:'none',onUpdate:()=>draw(state.t)});window.__timelines={main:tl};draw(0);
</script></body></html>
