const ir=__SPATIAL__,products=__PRODUCTS__,words=__WORDS__,duration=__DURATION__,world=document.querySelector('#world'),grid=document.querySelector('#grid'),caption=document.querySelector('.caption');

function camera(f){const k=ir.camera;let i=k.findIndex(x=>x.frame>=f);if(i<=0)return k[i<0?k.length-1:0];const a=k[i-1],b=k[i];let t=clamp((f-a.frame)/(b.frame-a.frame));t=t*t*(3-2*t);return {position:a.position.map((x,j)=>x+(b.position[j]-x)*t),look_at:a.look_at.map((x,j)=>x+(b.look_at[j]-x)*t),fov:a.fov+(b.fov-a.fov)*t}}
function draw(t){const f=Math.min(ir.total_frames-1,Math.floor(t*30+1e-5)),c=camera(f),forward=norm(sub(c.look_at,c.position)),right=norm(cross(forward,[0,1,0])),up=cross(right,forward),focal=960/Math.tan(c.fov*Math.PI/360);
function project(p){const v=sub(p,c.position),z=dot(v,forward);if(z<.5)return null;return [540+dot(v,right)*focal/z,810-dot(v,up)*focal/z,z]}
const track=ir.lighting||[],li=track.findIndex(k=>f>=k.start&&f<k.end),l=track[li];if(l){const prev=track[Math.max(0,li-1)],u=clamp((f-l.start)/18),rgb=l.rgb.map((v,i)=>Math.round(prev.rgb[i]+(v-prev.rgb[i])*u)),pulse=Math.max(0,...l.accents.map(k=>Math.max(0,1-Math.abs(f-k-5)/12)))*.10,target=ir.objects.find(o=>o.id===l.target),p=target&&project(target.position),x=p?Math.max(180,Math.min(900,p[0])):540,y=p?Math.max(300,Math.min(1300,p[1])):810;document.querySelector('#main').style.setProperty('--light-rgb',rgb.join(','));document.querySelector('#light').style.background='radial-gradient(ellipse at '+x+'px '+y+'px,rgba('+rgb.join(',')+','+(l.intensity+pulse)+'),transparent 62%)';}

let lines='';for(let i=-12;i<=12;i++){for(const [a,b] of [[[i,-3,-14],[i,-3,5]],[[-12,-3,i],[12,-3,i]]]){const p=project(a),q=project(b);if(p&&q)lines+='<path d="M'+p[0]+' '+p[1]+' L'+q[0]+' '+q[1]+'" stroke="#729dce" stroke-opacity=".10" stroke-width="2"/>'}}grid.innerHTML=lines;
for(const [o,e] of nodes){const overlap=0,active=f>=o.start&&f<o.end,p=project(o.position);e.style.display=active&&p?'block':'none';if(!active||!p)continue;const a=clamp((f-o.start)/8),b=clamp((o.end-f)/5),scale=Math.min(1.12,10/p[2])*(o.entrance==='pop'?(1-Math.pow(1-a,3)*.22+Math.sin(a*Math.PI)*.09):(.92+.08*a));const asset=products[o.asset],img=e.querySelector('img');if(asset&&img){const src=asset.frames?.length?asset.frames[Math.min(asset.frames.length-1,Math.floor((f-o.start)/2))]:asset.src;if(img.getAttribute('src')!==src)img.src=src}e.style.opacity=a*b*(o.kind==='background'?.22:o.kind==='overlay'?.18:o.kind==='ambient_tag'?.38:o.kind==='wireframe'?.45:1);e.style.zIndex=String(o.kind==='background'?0:o.kind==='overlay'?1100:Math.round(1000-p[2]*10));if(['subject','stat','panel','terminal','media'].includes(o.kind)){const halfW=Math.min(450,e.offsetWidth*scale/2+24),halfH=Math.min(480,e.offsetHeight*scale/2+24);p[0]=Math.max(70+halfW,Math.min(1010-halfW,p[0]));p[1]=Math.max(220+halfH,Math.min(1450-halfH,p[1]));}const rot=o.rotation||[0,0,0];e.style.filter=o.kind==='background'?'blur(2px)':'none';e.style.transform='translate('+p[0]+'px,'+(p[1]+(1-a)*22)+'px) translate(-50%,-50%) scale('+scale+') perspective(1400px) rotateX('+rot[0]+'deg) rotateY('+rot[1]+'deg) rotateZ('+rot[2]+'deg)'}
const cta=ir.cta,ctaEl=document.querySelector('#resource-cta'),show=cta&&f>=cta.start&&f<cta.end;ctaEl.style.display=show?'block':'none';world.style.opacity=show?'0.18':'1';if(show){const elapsed=f-cta.start,comment=ctaEl.querySelector('.comment'),file=ctaEl.querySelector('.file');comment.textContent=cta.keyword.slice(0,Math.min(cta.keyword.length,Math.floor(elapsed/2)+1));file.style.opacity=clamp((elapsed-cta.keyword.length*2)/12);file.style.transform='translateY('+((1-clamp((elapsed-cta.keyword.length*2)/12))*35)+'px)';}
let wi=words.findIndex(w=>t>=w.start&&t<w.end);if(wi<0)wi=words.findLastIndex(w=>w.start<=t);caption.replaceChildren();if(wi>=0&&t-words[wi].end<.4){const first=Math.floor(wi/4)*4;words.slice(first,first+4).forEach((w,j)=>{const span=document.createElement('span');span.textContent=w.word;if(first+j===wi)span.className='active';caption.append(span)})}document.querySelector('.progress i').style.width=(100*clamp(t/duration))+'%'}
const state={t:0},tl=gsap.timeline({paused:true});tl.to(state,{t:duration,duration,ease:'none',onUpdate:()=>draw(state.t)});window.__timelines={main:tl};draw(0);
