<!doctype html><html><head><meta charset="utf-8"><script src="./vendor/gsap.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#07060d;color:#f5f2ee;font-family:Poppins,Arial,sans-serif}#root{width:1080px;height:1920px;position:relative;overflow:hidden}canvas{position:absolute;inset:0}#kind{position:absolute;top:120px;left:80px;font-size:30px;color:#ff9d77;letter-spacing:4px}#headline{position:absolute;top:1120px;left:80px;right:80px;font-size:88px;line-height:1.05;font-weight:800;overflow-wrap:anywhere}#brand{position:absolute;bottom:380px;left:80px;font-size:24px;color:#a5aac0}
</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920"><canvas id="space"></canvas><div id="kind"></div><div id="headline"></div><div id="brand">RANGMANCH / AI RADAR</div></div>
<script type="module">
import * as THREE from './vendor/three.module.js';
const shots=__SHOTS__;
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#space'),antialias:true});
renderer.setSize(1080,1920,false);renderer.setClearColor(0x07060d);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(42,1080/1920,.1,100);
scene.add(new THREE.AmbientLight(0xc3caff,1.5));
for(const [color,x] of [[0xff6b35,-4],[0x3b6cff,4]]){const l=new THREE.PointLight(color,65,40);l.position.set(x,3,5);scene.add(l)}
const groups={};
const layouts={product_showcase:[[0,0,0,3,4]],repository_reveal:[[-1,1,0,3,2],[1,-1,-1,3,2]],comparison:[[-1.7,0,0,2.5,4],[1.7,0,0,2.5,4]],news_explainer:[[0,1,0,5,2],[0,-1,-1,4,1]],workflow_demo:[[-2,1,0,1.5,1.5],[0,0,-1,1.5,1.5],[2,-1,-2,1.5,1.5]],experiment_result:[[-1,-1,0,1.4,2],[1,0,0,1.4,4]]};
for(const [kind,layout] of Object.entries(layouts)){const g=new THREE.Group();layout.forEach(([x,y,z,w,h],i)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.22),new THREE.MeshStandardMaterial({color:i%2?0xff6b35:0x3b6cff,metalness:.55,roughness:.25}));m.position.set(x,y,z);g.add(m)});g.visible=false;scene.add(g);groups[kind]=g}
const headline=document.querySelector('#headline'),kindLabel=document.querySelector('#kind');
const state={t:0};
function draw(){const t=state.t;const shot=shots.find(s=>t>=s.start&&t<s.end)||shots[shots.length-1];const p=Math.max(0,Math.min(1,(t-shot.start)/(shot.end-shot.start)));for(const [k,g] of Object.entries(groups))g.visible=k===shot.scene;
const positions={dolly_in:[0,0,17-4*p],three_quarter_orbit:[4*Math.cos(p*Math.PI),1,15],tracking_follow:[-3+6*p,0,16],pull_back:[0,0,13+4*p]};camera.position.set(...positions[shot.camera]);camera.lookAt(0,0,0);
kindLabel.textContent=shot.scene.replaceAll('_',' ').toUpperCase();
const words=shot.headline.split(/\s+/);headline.textContent=shot.typography==='word_reveal'?words.slice(0,Math.max(1,Math.ceil(p*words.length*2))).join(' '):shot.headline;
const q=Math.min(1,p*5);headline.style.opacity=String(q);headline.style.transform=shot.typography==='kinetic_emphasis'?'translateY('+((1-q)*60)+'px) scale('+(1+.08*(1-q))+')':shot.typography==='hero_statement'?'scale('+(0.94+.06*q)+')':'none';
renderer.render(scene,camera)}
const timeline=gsap.timeline({paused:true});timeline.to(state,{t:__DURATION__,duration:__DURATION__,ease:'none',onUpdate:draw},0);window.__timelines=window.__timelines||{};window.__timelines.main=timeline;draw();
</script></body></html>
