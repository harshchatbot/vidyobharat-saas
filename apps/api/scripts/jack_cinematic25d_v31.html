<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JACK 2.5D CDC shot</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#07060d;color:#f5f2ee;font-family:Arial,sans-serif;overflow:hidden}#stage{position:absolute;width:540px;height:960px;overflow:hidden;background:radial-gradient(ellipse at 48% 42%,#2a1208,#07060d 72%);perspective:950px;transform-origin:top left}#world{position:absolute;inset:0;transform-style:preserve-3d}#grid{position:absolute;inset:20% -40%;transform:rotateX(65deg) translateZ(-220px);background:repeating-linear-gradient(90deg,transparent 0 39px,#ff6b3522 40px),repeating-linear-gradient(0deg,transparent 0 39px,#ff6b3522 40px);opacity:.5}#record,#bus,#subscribers,#end{position:absolute;transform-style:preserve-3d}#record{left:105px;top:240px;width:330px;padding:28px;border:1px solid #ff6b35;border-radius:22px;background:linear-gradient(135deg,#281d28,#0e1020);box-shadow:0 20px 80px #ff6b3533}#record .name{font-size:28px;font-weight:800}#record .field{margin-top:22px;font-size:19px;color:#f8bd98}#bus{top:475px;left:70px;width:400px;text-align:center;border-top:3px solid #ff6b35;padding-top:12px;font-size:14px;letter-spacing:4px;opacity:0}#pulse{position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:#ff6b35;box-shadow:0 0 24px 12px #ff6b3588}#subscribers{top:565px;left:30px;display:flex;gap:10px;opacity:0}.subscriber{width:153px;padding:20px 8px;text-align:center;background:#111b32;border:1px solid #3b6cff;border-radius:14px;font-size:18px;font-weight:bold}.status{font-size:12px;margin-top:12px;color:#8798ba}#caption{position:absolute;top:740px;left:32px;width:476px;font-size:34px;font-weight:800;line-height:1.2;text-align:center;text-shadow:0 4px 18px #000}#end{top:350px;left:30px;width:480px;text-align:center;font-size:47px;font-weight:900;line-height:1.2;opacity:0;color:#fff}#hud{position:absolute;top:55px;left:30px;font-size:13px;letter-spacing:2px;color:#f6a77c}#progress{position:absolute;top:86px;left:30px;height:2px;background:#ff6b35;width:0}#watermark{position:absolute;bottom:40px;left:24px;font-size:13px;color:#e4a87f}
</style><div id="stage"><div id="world"><div id="grid"></div><div id="record"><div class="name">Opportunity</div><div class="field" id="field">Stage: Negotiation</div></div><div id="bus">EVENT BUS<div id="pulse"></div></div><div id="subscribers"><div class="subscriber">ERP<div class="status">WAITING</div></div><div class="subscriber">Integration<div class="status">WAITING</div></div><div class="subscriber">Analytics<div class="status">WAITING</div></div></div></div><div id="caption"></div><div id="end">DATA CHANGES.<br><span style="color:#ff6b35">SYSTEMS REACT.</span></div><div id="hud">01 / 01 · CHANGE DATA CAPTURE</div><div id="progress"></div><div id="watermark">JACK V3.1 · UNAPPROVED VISUAL PREVIEW · NO AUDIO</div></div><script>
const $=id=>document.getElementById(id);const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const lerp=(a,b,t)=>a+(b-a)*t;const ease=t=>t*t*(3-2*t);
const captions=[["When a Salesforce record changes,",0,60],["a change event is published.",60,120],["Every listening system reacts.",120,180]];
function seek(frame){const f=clamp(Number(frame)||0,0,209),t=ease(f/210),z=lerp(0,200,t),ry=lerp(-8,0,t),rx=lerp(4,0,t);$("world").style.transform=`translateZ(${z}px) rotateY(${ry}deg) rotateX(${rx}deg)`;
$("record").style.transform=`translateY(${(1-ease(clamp((f-8)/25)))*350}px) rotateY(-10deg) rotateX(6deg)`;
$("field").textContent=f>=36?"Stage: Closed Won":"Stage: Negotiation";$("field").style.color=f>=36?"#3ddc84":"#f8bd98";
$("bus").style.opacity=clamp((f-56)/16);$("pulse").style.left=`${clamp((f-64)/48)*95}%`;
$("subscribers").style.opacity=clamp((f-100)/20);document.querySelectorAll(".status").forEach((s,i)=>{const on=f>=132+i*8;s.textContent=on?"SYNCED":"WAITING";s.style.color=on?"#3ddc84":"#8798ba"});
$("end").style.opacity=clamp((f-180)/15);$("world").style.opacity=1-clamp((f-180)/18)*.85;
const beat=captions.find(c=>f>=c[1]&&f<c[2]);$("caption").textContent=beat?beat[0]:"";$("caption").style.opacity=beat?Math.min(1,(f-beat[1])/9):0;$("progress").style.width=`${480*f/210}px`;
$("stage").style.background=f<120?"radial-gradient(ellipse at 48% 42%,#2a1208,#07060d 72%)":"radial-gradient(ellipse at 48% 42%,#0b1942,#07060d 72%)";
}
window.seekFrame=seek;const params=new URLSearchParams(location.search);if(params.has("frame"))seek(+params.get("frame"));else{let start=performance.now();function tick(now){seek(Math.floor(((now-start)/1000*30)%210));requestAnimationFrame(tick)}requestAnimationFrame(tick)}
</script></html>
