
name: rangmanch

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: rangmanch-api:latest
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production
    environment:
      ENV: production
      LOCAL_EDITOR_MODE: "false"
      PORT: "8000"
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - rangmanch-data:/app/data
      - /opt/rangmanch/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    networks:
      - default
      - music-db
    mem_limit: 384m

  export-worker:
    image: rangmanch-api:latest
    restart: unless-stopped
    command: python -m app.services.guest_export_worker
    env_file:
      - ./apps/api/.env.production
    environment:
      ENV: production
      LOCAL_EDITOR_MODE: "false"
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - rangmanch-data:/app/data
      - /opt/rangmanch/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    mem_limit: 768m

  music-worker:
    image: rangmanch-api:latest
    restart: unless-stopped
    command: python -m app.services.music_studio_worker
    env_file:
      - ./apps/api/.env.production
    environment:
      ENV: production
      LOCAL_EDITOR_MODE: "false"
    volumes:
      - rangmanch-data:/app/data
    networks:
      - default
      - music-db
    mem_limit: 512m

  # Optional heavy worker. Do not activate on the small EC2 instance.
  # Requires a suitably sized host, validated Demucs model rights and
  # MUSIC_STUDIO_SEPARATION_ENABLED=true on the API only after readiness.
  music-separation-worker:
    profiles: ["separation"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.separation
    image: rangmanch-separation-worker:latest
    restart: unless-stopped
    command: python -m app.services.music_studio_worker
    env_file:
      - ./apps/api/.env.production
    environment:
      ENV: production
      LOCAL_EDITOR_MODE: "false"
      MUSIC_STUDIO_WORKER_KIND: separation
    volumes:
      - rangmanch-data:/app/data
    networks:
      - default
      - music-db
    mem_limit: 3g

volumes:
  rangmanch-data:

networks:
  music-db:
    external: true
    name: techfilabs-n8n_default
