
name: rangmanch

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: rangmanch-api:latest
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production
    environment:
      ENV: production
      LOCAL_EDITOR_MODE: "false"
      PORT: "8000"
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      RANGMANCH_STT_URL: http://stt:8765
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - rangmanch-data:/app/data
      - /opt/rangmanch/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    networks:
      - default
      - music-db
    mem_limit: 384m

  export-worker:
    image: rangmanch-api:latest
    restart: unless-stopped
    command: python -m app.services.guest_export_worker
    env_file:
      - ./apps/api/.env.production
    environment:
      ENV: production
      LOCAL_EDITOR_MODE: "false"
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - rangmanch-data:/app/data
      - /opt/rangmanch/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    mem_limit: 768m

  stt:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.stt
    image: rangmanch-stt:tiny-v1
    restart: unless-stopped
    command: uvicorn app.services.stt_server:app --host 0.0.0.0 --port 8765 --workers 1
    env_file:
      - ./apps/api/.env.production
    environment:
      RANGMANCH_STT_MODEL: tiny
      OMP_NUM_THREADS: "1"
    networks:
      - default
    mem_limit: 768m
    cpus: 1.0

  music-worker:
    image: rangmanch-api:latest
    restart: unless-stopped
    command: python -m app.services.music_studio_worker
    env_file:
      - ./apps/api/.env.production
    environment:
      ENV: production
      LOCAL_EDITOR_MODE: "false"
    volumes:
      - rangmanch-data:/app/data
    networks:
      - default
      - music-db
    mem_limit: 512m

volumes:
  rangmanch-data:

networks:
  music-db:
    external: true
    name: techfilabs-n8n_default
