name: JACK offline regression
on:
  push:
    branches: [feature/content-autopilot-v1]
    paths:
      - 'apps/api/scripts/jack_hyperframes/**'
      - '.github/workflows/jack-offline-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.ref == 'refs/heads/feature/content-autopilot-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated regression suites
        working-directory: apps/api/scripts/jack_hyperframes/creative_lab
        run: |
          set -o pipefail
          python -m unittest -v test_producer test_motion_v21 test_quality_audio 2>&1 | tee regression.log
      - name: Preserve actual test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jack-offline-regression
          path: apps/api/scripts/jack_hyperframes/creative_lab/regression.log
