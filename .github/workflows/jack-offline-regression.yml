name: JACK offline regression
on:
  push:
    branches: [feature/content-autopilot-v1]
    paths:
      - 'apps/api/scripts/jack_hyperframes/**'
      - '.github/workflows/jack-offline-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.ref == 'refs/heads/feature/content-autopilot-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - name: Run all JACK offline tests and syntax checks
        working-directory: apps/api/scripts/jack_hyperframes
        env:
          PYTHONPATH: ../..
        run: |
          set -o pipefail
          python -B -m pytest -p no:cacheprovider -q . 2>&1 | tee regression.log
          while IFS= read -r -d '' script; do node --check "$script"; done < <(find . -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
          bash -n bootstrap.sh
          bash -n benchmark_v6.sh
      - name: Preserve actual test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jack-offline-regression
          path: apps/api/scripts/jack_hyperframes/regression.log
